services:
  db:
    image: postgres:16
    container_name: openpos-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C.UTF-8"
    volumes:
      - openpos-db-data:/var/lib/postgresql/data
      - ./backend/src/repository/postgres/query/cadpos_psql.sql:/docker-entrypoint-initdb.d/cadpos_psql.sql
    ports:
      - "5432:5432"
    networks:
      - openpos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openpos-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
    working_dir: /backend
    volumes:
      - ./backend/log:/backend/log
      - ./ACPO:/backend/ACPO
    ports:
      - "8000:8000"
    networks:
      - openpos

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openpos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - openpos

networks:
  openpos:
    driver: bridge

volumes:
  openpos-db-data: